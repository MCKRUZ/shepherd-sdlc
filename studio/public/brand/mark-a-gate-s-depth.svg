<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Shepherd">
  <!-- Mark A — Depth. The two-tone mark stays as drawn; ONE linear gradient in user space is laid
       over its own silhouette (a clip of the four paths) at 30 %, so frame and S read as one object
       lit from one side. The vector is the frame's outer corners, top-left (4, 4) → bottom-right
       (60, 60): it runs perpendicular to both chamfer seams, so each half is lit the same way.
       Light pair moss-300 → moss-900 (#9DC58E → #192D17); the app swaps the dark pair
       (#9DC58E → #3F6B35) through its mark-depth-a / mark-depth-b tokens. Hero and icon only, 48 px+. -->
  <defs>
    <linearGradient id="depth" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="60" y2="60">
      <stop offset="0" stop-color="#9DC58E"/>
      <stop offset="1" stop-color="#192D17"/>
    </linearGradient>
    <clipPath id="mark">
