name: Dependency Scan

# =============================================================================
# The STANDING STOCK of third-party vulnerabilities — periodic, never blocking.
# =============================================================================
# The other half of the dependency position (GOLD-STANDARD §7). Its sibling, the
# `dependency-gate` job in ci.yml, is diff-scoped: it blocks a change that
# INTRODUCES a vulnerable package. This workflow owns everything that is already
# here — packages that were fine when they landed and became advisories later.
#
# ── WHY THIS DOES NOT BLOCK ANYTHING ─────────────────────────────────────────
# A vulnerability published overnight is not a regression anyone caused, and
# failing every open PR the next morning would teach the team that red is normal
# — which degrades the signal on every other gate in the repo. So this raises an
# ISSUE, and the fix rides the normal rails as an ordinary spec, prioritised by a
# human against everything else in flight. That is slower than a hard stop, and
# deliberately so: the alternative is a gate everyone learns to route around.
#
# ── WHY IT IS ON BY DEFAULT, WHERE eval-suite IS OPT-IN ──────────────────────
# `eval-suite.yml` is off until a repo opts in because every run spends real
# money at a judge model. This one costs a few CI minutes. A security scan you
# have to remember to switch on is a security scan that is not running anywhere,
# and "nobody enabled it" is not a finding anyone discovers until it matters.
# Set the repository variable DEPENDENCY_SCAN_ENABLED=false to suppress it, and
# expect to justify that in the client's security review.
#
# ── PLACEHOLDER ───────────────────────────────────────────────────────────────
#   <<DEPENDENCY_SCAN_CMD>>  the stack's scan command. Reference value below is
#                            .NET's, from packs/stacks/dotnet/ci-profile.yaml
#                            (dependency_scan.command). Contract: one TSV finding
#                            per line — severity, package, version, advisory-url —
#                            and exit 0 whether or not it finds anything.
# =============================================================================
#
# ── PACK NOTE (github CI/CD pack) ─────────────────────────────
# The scan command IS the stack seam here («stack pack: ci-profile.dependency_scan.command»),
# filled by the installer from the selected stack pack. Everything else — the schedule, the
# issue lifecycle, the opt-out variable — is platform/repo level and stack-agnostic.
# Pairs with dependabot.yml (upgrade proposals) and ci.yml's dependency-gate (the blocking,
# diff-scoped half of the same position).

on:
  schedule:
    # Monday 07:00 UTC — a working morning, so what it finds gets triaged the same
    # day rather than ageing over a weekend.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write        # the finding is an issue; that is this workflow's whole output

concurrency:
  group: dependency-scan
  cancel-in-progress: true

jobs:
  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.DEPENDENCY_SCAN_ENABLED != 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: actions/setup-python@v6          # «stack pack: ci-profile.toolchain.id» via toolchain_map
        with:
          python-version: '3.13'   # «stack pack: ci-profile.toolchain.version»

      # THIS REPOSITORY HAS TWO ECOSYSTEMS, not one. The seam above is the stack pack's, and
      # it is Python. The desktop app in studio/ is a Node application with 406 dependencies of its
      # own, and until this was added they were invisible to a scan that told its issue it
      # covered "this repo's dependencies" — the scan would have kept reporting clean over
      # hundreds of unexamined packages. A scan whose blind spot is undeclared is worse than
      # no scan, because it answers the question nobody then re-asks.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # THE ACTUAL REASON THIS SCAN NEVER SCANNED. Its command has always begun with `uv`,
      # and this workflow never installed uv — only Python. So the very first word failed
      # with "command not found", the `|| true` swallowed it, and an empty report was read as
      # a clean one. ci.yml installs uv in every job that needs it; this workflow was simply
      # never given the same line.
      - uses: astral-sh/setup-uv@v8.3.2

      # Renamed from "Scan every dependency", which it never was — it is the Python half, and
      # calling it "every" is how the gap stayed invisible.
      - name: Scan Python dependencies
        id: scan_python
        run: |
          set -uo pipefail
          # «stack pack: ci-profile.dependency_scan.command»
          # Contracted to exit 0 whether or not it finds anything — findings are DATA. At
          # least one supported tool (.NET) exits 0 on a High advisory while another (npm)
          # exits non-zero, so never infer the result from the status; read the output.
          # THIS COMMAND USED TO BE `(uv run --frozen pip-audit ... || true) | jq ...` AND IT
          # SCANNED NOTHING, EVER. pip-audit is not a declared dependency of this project, so
          # `uv run pip-audit` failed with "program not found"; the `|| true` turned that into
          # empty output; empty output is indistinguishable from "no advisories"; and the job
          # reported clean. It was added to stop a FINDING failing the step and it silenced
          # total failure alongside. The guard below is what exposed it — on its first run.
          #
          # Two changes make it real. `uvx` fetches pip-audit rather than assuming it is
          # installed, and the thing audited is the project's own LOCKED dependency set,
          # exported explicitly. `--no-emit-project` matters: the export otherwise lists the
          # local package itself as an editable install, which pip-audit tries to build and
          # fails on.
          uv export --project scripts --frozen --format requirements-txt --no-hashes \
            --no-emit-project -o "${RUNNER_TEMP}/pip-requirements.txt"

          # Non-zero here can mean "found advisories", so the status is not the answer — the
          # same rule the desktop-app step states. Only a missing or unusable report is a failure.
          if ! uvx pip-audit --format json --requirement "${RUNNER_TEMP}/pip-requirements.txt" \
               > "${RUNNER_TEMP}/pip-audit.json" 2> "${RUNNER_TEMP}/scan.err"; then
            if ! jq -e 'has("dependencies")' "${RUNNER_TEMP}/pip-audit.json" >/dev/null 2>&1; then
              echo "::error title=Dependency scan failed::The scan did not complete, so this repo's vulnerability status is UNKNOWN — which is not the same as clean. Fix the scan."
              sed -n '1,40p' "${RUNNER_TEMP}/scan.err" || true
              exit 1
            fi
          fi

          # HOW MANY PACKAGES WERE ACTUALLY LOOKED AT — the same guard the desktop-app step below
          # carries, and it belongs here for exactly the same reason. The grader caught the
          # asymmetry of hardening one ecosystem and not the other; this guard then caught a
          # scan that had never examined a single package.
          PY_AUDITED="$(jq -r '[.dependencies[]?] | length' "${RUNNER_TEMP}/pip-audit.json" 2>/dev/null || echo 0)"
          if [ "${PY_AUDITED:-0}" -eq 0 ]; then
            echo "::error title=Python dependency scan examined nothing::pip-audit reported 0 dependencies, so a clean result here means the scan did not run, not that the plugin is clean."
            exit 1
          fi
          echo "Plugin: ${PY_AUDITED} Python dependencies examined."

          jq -r '.dependencies[]? | . as $d | ($d.vulns[]? | ["unknown", $d.name, $d.version, ("https://osv.dev/vulnerability/" + .id)] | @tsv)' \
            "${RUNNER_TEMP}/pip-audit.json" | sort -u > "${RUNNER_TEMP}/findings.tsv"

          sort -u -o "${RUNNER_TEMP}/findings.tsv" "${RUNNER_TEMP}/findings.tsv"
          COUNT="$(wc -l < "${RUNNER_TEMP}/findings.tsv" | tr -d ' ')"
          echo "Advisories across Python dependencies: ${COUNT}"
          cat "${RUNNER_TEMP}/findings.tsv" || true

      # The other half of this repository. APPENDED to the same file in the same four-column
      # shape, so everything downstream — the count, the issue table, the self-closing
      # behaviour — works on both ecosystems without knowing there are two.
      - name: Scan the desktop app's dependencies too
        id: scan
        working-directory: studio
        run: |
          set -uo pipefail
          # `npm audit` reads package-lock.json and asks the registry, so it needs no install.
          # It exits NON-ZERO when it finds something, which is why the result is read from the
          # output and never inferred from the status — the same rule the Python half states.
          if ! npm audit --json > "${RUNNER_TEMP}/npm-audit.json" 2> "${RUNNER_TEMP}/npm.err"; then
            if ! jq -e 'has("vulnerabilities") or has("metadata")' "${RUNNER_TEMP}/npm-audit.json" >/dev/null 2>&1; then
              echo "::error title=Desktop app dependency scan failed::npm audit produced no usable report, so the desktop app's vulnerability status is UNKNOWN — which is not the same as clean."
              sed -n '1,40p' "${RUNNER_TEMP}/npm.err" || true
              exit 1
            fi
          fi
          # One line per advisory. `via` carries strings (transitive blame) and objects (the
          # actual advisory); only the objects have a severity and a URL worth reporting.
          jq -r '
            (.vulnerabilities // {}) | to_entries[] | .value as $v
            | ($v.via[]? | select(type == "object"))
            | [.severity, $v.name, ($v.range // "unknown"), (.url // "unknown")] | @tsv
          ' "${RUNNER_TEMP}/npm-audit.json" | sort -u >> "${RUNNER_TEMP}/findings.tsv"

          # HOW MANY PACKAGES WERE ACTUALLY LOOKED AT. "0 advisories" is also what a step that
          # scanned nothing reports, and that ambiguity is the entire reason this gap survived
          # for as long as it did. Saying the denominator makes the clean result a claim that
          # cannot be satisfied by doing nothing — and zero audited is a failure, not a pass.
          AUDITED="$(jq -r '.metadata.dependencies.total // 0' "${RUNNER_TEMP}/npm-audit.json")"
          if [ "${AUDITED:-0}" -eq 0 ]; then
            echo "::error title=Desktop app dependency scan examined nothing::npm audit reported 0 dependencies, so a clean result here means the scan did not run, not that the desktop app is clean. Check studio/package-lock.json."
            exit 1
          fi
          echo "Desktop app (studio/): ${AUDITED} Node dependencies examined."

          sort -u -o "${RUNNER_TEMP}/findings.tsv" "${RUNNER_TEMP}/findings.tsv"
          COUNT="$(wc -l < "${RUNNER_TEMP}/findings.tsv" | tr -d ' ')"
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "Advisories across ALL dependencies, Python and Node: ${COUNT}"
          cat "${RUNNER_TEMP}/findings.tsv" || true

      - name: Raise, update, or close the advisory issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COUNT: ${{ steps.scan.outputs.count }}
          LABEL: 'dependency-advisory'
        run: |
          set -euo pipefail

          # One canonical issue, found by label — updated in place rather than a fresh issue
          # every Monday. A tracker that grows a duplicate per week is a tracker people mute,
          # and a muted tracker is the same as no scan at all.
          gh label create "$LABEL" --description "Known vulnerabilities in third-party dependencies" --color B60205 2>/dev/null || true
          EXISTING="$(gh issue list --repo "$REPO" --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')"

          if [ "${COUNT:-0}" -eq 0 ]; then
            if [ -n "$EXISTING" ]; then
              # Self-closing on purpose: an issue that stays open after the advisories are
              # gone trains everyone to ignore the label.
              gh issue close "$EXISTING" --repo "$REPO" \
                --comment "No known vulnerabilities remain in this repo's Python or Node dependencies as of $(date -u +%Y-%m-%d). Closed by the scheduled dependency scan."
              echo "Closed #${EXISTING} — clean."
            else
              echo "OK: no known vulnerabilities, and no open advisory issue."
            fi
            exit 0
          fi

          {
            echo "The scheduled dependency scan found **${COUNT}** advisory/advisories across this repo's dependencies — both the plugin's Python packages and the desktop app's Node packages under \`studio/\`."
            echo
            echo "These are **pre-existing** — the \`dependency-gate\` check blocks anything a change newly introduces, so nothing here was added by a recent PR. That is why this is an issue and not a red build."
            echo
            # The third column means two different things depending on which ecosystem the row
            # came from — the installed version for a Python package, the AFFECTED RANGE for a
            # Node one, because npm's report gives a range rather than what is installed. One
            # header reading "Version" over both quietly invited a reader to act on the wrong
            # number, so it says which is which.
            echo "| Severity | Package | Version installed / affected range | Advisory |"
            echo "| --- | --- | --- | --- |"
            while IFS=$'\t' read -r sev pkg ver url; do
              echo "| ${sev} | \`${pkg}\` | ${ver} | ${url} |"
            done < "${RUNNER_TEMP}/findings.tsv"
            echo
            echo "**What to do with this.** Triage it like any other work: it becomes a spec, gets a risk tier, and rides the same rails. Upgrading a package that handles auth, payments or client data is a \`risk:high\` change (GOLD-STANDARD §5.1). If an advisory is being accepted rather than fixed, record it in \`.github/dependency-exceptions.md\` with an expiry — the ledger is what makes that a decision rather than a silence."
            echo
            echo "_Updated by the scheduled dependency scan, $(date -u +%Y-%m-%d). This issue closes itself when the advisories clear._"
          } > "${RUNNER_TEMP}/body.md"

          TITLE="Dependency advisories: ${COUNT} package(s) with known vulnerabilities"
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$REPO" --title "$TITLE" --body-file "${RUNNER_TEMP}/body.md"
            echo "Updated #${EXISTING}."
          else
            gh issue create --repo "$REPO" --title "$TITLE" --label "$LABEL" --body-file "${RUNNER_TEMP}/body.md"
            echo "Opened a new advisory issue."
          fi
